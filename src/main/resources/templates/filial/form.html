<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário teste</title>
</head>

<body>
    <form th:action="@{/filiais}" th:object="${filial}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="nome-filial">Nome Filial:</label>
        <input type="text" id="nome-filial" th:field="*{nome}">
        <br><br>

        <label for="codigo-filial">Código Filial:</label>
        <input type="text" id="codigo-filial" th:field="*{codigoFilial}">
        <br><br>

        <label for="cnpj">CNPJ:</label>
        <input type="text" id="cnpj" th:field="*{cnpj}">
        <br><br>

        <input type="submit" value="Enviar">
    </form>
</body>

</html>
